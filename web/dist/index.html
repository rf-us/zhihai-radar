<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>知海选品雷达</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #f7f7f5; color: #1f1f1d;
    font: 14px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: #6b6b66; margin: 0 0 28px; }
  .card { background: #fff; border: 1px solid #e6e6e1; border-radius: 12px; padding: 20px 22px; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  .k { color: #6b6b66; }
  .v { font-variant-numeric: tabular-nums; }
  .ok { color: #1d7a52; }
  .bad { color: #a33; }
  label { display: block; font-size: 13px; color: #55554f; margin-bottom: 6px; }
  input {
    width: 100%; padding: 9px 11px; margin-bottom: 12px;
    border: 1px solid #dcdcd6; border-radius: 8px; font: inherit; background: #fff;
  }
  input:focus { outline: 2px solid #cfe0f5; border-color: #8fb6e0; }
  button {
    padding: 9px 16px; border: 1px solid #1f1f1d; background: #1f1f1d; color: #fff;
    border-radius: 8px; font: inherit; cursor: pointer;
  }
  button.ghost { background: #fff; color: #1f1f1d; border-color: #d6d6d0; }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #a33; margin-top: 10px; min-height: 20px; font-size: 13px; }
  .hint { color: #8a8a83; font-size: 12px; margin-top: 10px; }
  ul { margin: 8px 0 0; padding-left: 18px; color: #55554f; }
  code { background: #f1f1ec; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>知海选品雷达</h1>
  <p class="sub">把知乎上的真实讨论，变成可验证的出海选品结论。</p>

  <div class="card">
    <div class="row">
      <div>
        <div class="k">RFERP 连接</div>
        <div id="reef-line" class="v">检测中…</div>
      </div>
      <div id="reef-badge" class="v">…</div>
    </div>
  </div>

  <div class="card" id="login-card">
    <label for="u">RFERP 账号</label>
    <input id="u" autocomplete="username" placeholder="例如 admin" />
    <label for="p">密码</label>
    <input id="p" type="password" autocomplete="current-password" placeholder="只用于换取会话，不落盘" />
    <button id="login">登录</button>
    <div class="err" id="err"></div>
    <div class="hint">radar 用你的账号登录 RFERP，token 只存在服务端内存；浏览器拿不到它。</div>
  </div>

  <div class="card" id="main-card" hidden>
    <div class="row">
      <div>
        <div class="k">当前用户</div>
        <div id="user-line" class="v"></div>
      </div>
      <button class="ghost" id="logout">退出</button>
    </div>
    <ul id="facts"></ul>
  </div>

  <div class="card">
    <div class="k">下一步</div>
    <ul>
      <li>选品工作台（分析 / 证据链 / 成本测算 / 采纳）在后续提交中落地</li>
      <li>接口契约见仓库 <code>contracts/reef-api.md</code></li>
    </ul>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const api = async (path, init = {}) => {
  const res = await fetch(path, { credentials: 'same-origin', ...init });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error((data && data.error) || res.status + ' ' + res.statusText);
  return data;
};

async function loadReef() {
  try {
    const info = await api('/healthz');
    $('reef-line').textContent = info.reefBase;
    $('reef-badge').textContent = '服务正常';
    $('reef-badge').className = 'v ok';
  } catch (e) {
    $('reef-badge').textContent = 'radar 未响应';
    $('reef-badge').className = 'v bad';
  }
}

async function loadSession() {
  try {
    const me = await api('/api/session');
    showUser(me.user);
    await loadStatus();
  } catch {
    $('login-card').hidden = false;
    $('main-card').hidden = true;
  }
}

async function loadStatus() {
  try {
    const s = await api('/api/reef/status');
    if (s.connected) {
      const r = s.reef || {};
      $('reef-line').textContent = `${s.reefBase} · ${r.storage || '?'} · 接口 v${r.apiVersion}`;
      $('reef-badge').textContent = s.canAdopt ? '可采纳' : '只读';
      $('reef-badge').className = 'v ' + (s.canAdopt ? 'ok' : 'bad');
      $('facts').innerHTML = `
        <li>RFERP 版本：${r.appVersion || '未知'}（schema v${r.schemaVersion ?? '?'}）</li>
        <li>数据库标识：<code>${r.databaseId || '未知'}</code></li>
        <li>${s.canAdopt ? '当前账号是管理员，可以执行采纳。' : '当前账号不是管理员，采纳会被 RFERP 拒绝。'}</li>`;
    } else {
      $('reef-badge').textContent = '不可达';
      $('reef-badge').className = 'v bad';
      $('reef-line').textContent = s.message || '无法连接 RFERP';
    }
  } catch (e) {
    $('reef-badge').textContent = '未知';
    $('reef-badge').className = 'v bad';
  }
}

function showUser(user) {
  $('login-card').hidden = true;
  $('main-card').hidden = false;
  $('user-line').textContent = `${user.display_name || user.username}（${user.role}）`;
}

$('login').addEventListener('click', async () => {
  $('err').textContent = '';
  $('login').disabled = true;
  try {
    const out = await api('/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('u').value.trim(), password: $('p').value }),
    });
    $('p').value = '';
    showUser(out.user);
    await loadStatus();
  } catch (e) {
    $('err').textContent = e.message;
  } finally {
    $('login').disabled = false;
  }
});

$('logout').addEventListener('click', async () => {
  try { await api('/api/session', { method: 'DELETE' }); } catch {}
  $('main-card').hidden = true;
  $('login-card').hidden = false;
});

loadReef();
loadSession();
</script>
</body>
</html>
